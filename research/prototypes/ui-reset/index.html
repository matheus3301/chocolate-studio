<div class="prototype"><div><strong>Proposta 02</strong><span class="prototype-note"> · Simulação — não acessa o pedal</span></div><nav aria-label="Apresentação"><button data-view="editor" class="active">Protótipo</button><button data-view="flows">Fluxos</button><button data-view="research">Pesquisa</button></nav><label>Cenário<select id="scenario"><option value="custom">Editando ações</option><option value="first">Primeiro acesso</option><option value="fixed">Presets em sequência</option><option value="missing">Pedal não encontrado</option><option value="denied">Permissão negada</option><option value="multiple">Portas ambíguas</option><option value="disconnected">Desconectado</option><option value="conflict">Conflito ao salvar</option></select></label></div>
<div id="page"></div><dialog id="dialog" aria-labelledby="dialogTitle"></dialog>
<script>
const $=s=>document.querySelector(s), h=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let view='editor', scenario='custom', connection='connected', mode='custom', selected=0, gesture='tap', page=0, group=0, showMidi=false, changes=new Set(), modeChanged=false, saved=false, saving=false, channel=1, openSource=null;
const letters=['A','B','C','D'];
const actionLabels={preset:'Selecionar preset',tap:'Marcar tempo (tap tempo)',on:'Ligar efeito',off:'Desligar efeito',tuner:'Entrar no afinador',exit:'Sair do afinador',expression:'Definir posição de expressão',none:'Sem ação'};
const createGroups=()=>Array.from({length:8},(_,g)=>letters.map((l,i)=>({tap:{device:'m5',action:'preset',number:(g*4+i)%24+1},hold:{device:'m5',action:i===0?'preset':i===1?'tap':i===2?'tuner':'none',number:2}})));
let groups=createGroups(); let initialMode='custom'; const modeName=m=>m==='fixed'?'Presets em sequência':'Ações personalizadas';
const item=()=>groups[group][selected][gesture];
const name=a=>a.action==='preset'?`Preset ${a.number}`:a.action==='none'?'Sem ação':a.action==='tap'?'Tap tempo':a.action==='tuner'?'Afinador':a.action==='exit'?'Sair do afinador':a.action==='on'?'Ligar efeito':a.action==='off'?'Desligar efeito':a.action==='expression'?`Expressão ${a.number}`:a.action==='pc'?`Programa ${a.number}`:`CC ${a.number}`;
function mark(){changes.add(`${group}-${selected}`);saved=false}
function reset(s){view='editor';scenario=s;connection=['first','missing','denied','multiple'].includes(s)?s:s==='disconnected'?'disconnected':'connected';mode=s==='fixed'||s==='first'?'fixed':'custom';initialMode=mode;selected=0;gesture='tap';page=0;group=0;changes=new Set();modeChanged=false;saved=false;saving=false;groups=createGroups();showMidi=false;if(s==='conflict'||s==='disconnected'){groups[0][0].hold.number=2;changes.add('0-0')}render()}
function appbar(){return `<header class="appbar"><div class="brand">Chocolate<span>Studio</span></div><nav class="appnav" aria-label="Ferramentas"><button class="quiet" data-do="files">Configurações</button><button class="quiet" data-do="settings">Ajustes</button><button class="quiet" data-do="preferences" aria-label="Preferências">⚙</button></nav></header>`}
function hardware(){return `<div class="hardware" aria-label="Chocolate Plus, visualização da configuração"><div class="hardwareName">CHOCOLATE PLUS</div><div class="physical">${[0,1,'display',2,3].map(i=>i==='display'?`<div class="display"><small>Visualização</small><strong>${mode==='fixed'?String(page*4+selected).padStart(3,'0'):letters[selected]}</strong></div>`:`<button class="switch" data-switch="${i}" aria-label="Editar botão ${letters[i]}" aria-pressed="${selected===i}" ${connection!=='connected'&&connection!=='disconnected'?'disabled':''}><span class="metal"></span><b>${letters[i]}</b></button>`).join('')}</div><div class="combos"><span class="comboline">E · A + B</span><span></span><span class="comboline">F · C + D</span></div></div>`}
function entry(){let title='Conecte seu Chocolate', desc='Ligue o pedal ao computador por USB. Vamos abrir a configuração que já está nele.', action='Conectar Chocolate';if(connection==='missing'){title='Chocolate não encontrado';desc='Confira o cabo USB e se o pedal está ligado. A lista também será atualizada quando ele aparecer.';action='Atualizar dispositivos'}if(connection==='denied'){title='O acesso MIDI está bloqueado';desc='Permita o acesso a MIDI nas configurações deste site no navegador. Depois, tente novamente.';action='Tentar novamente'}if(connection==='multiple'){title='Qual Chocolate você quer editar?';desc='Há mais de uma conexão possível. Escolha o controlador para abrir sua configuração.'}return `${appbar()}<main class="shell"><div class="entry">${hardware()}<h1>${title}</h1><p>${desc}</p>${connection==='multiple'?`<div class="devices"><button data-do="connect"><strong>Chocolate Plus · USB 1</strong><small>Par de portas 1 — exemplo simulado</small></button><button data-do="connect"><strong>Chocolate Plus · USB 2</strong><small>Par de portas 2 — exemplo simulado</small></button><button class="textbutton" data-do="manual">Escolher entrada e saída manualmente</button></div>`:`<div class="entry-actions"><button class="primary" data-do="connect">${action}</button>${connection==='first'?'<span class="small muted">Na primeira vez, o navegador pedirá acesso a MIDI.</span>':'<button class="quiet" data-do="help">Ajuda para conectar</button>'}</div>`}<p class="footnote">Já tem uma configuração? <button class="inlineLink" data-do="files">Abrir arquivo</button></p></div></main>`}
function summaries(){return `<div class="summaries" aria-label="Resumo dos botões">${letters.map((l,i)=>`<button class="summary" data-switch="${i}" aria-pressed="${i===selected}"><span class="summaryTitle"><span class="letter">${l}${mode==='fixed'?` <span class="muted mono small">${String(page*4+i).padStart(3,'0')}</span>`:''}</span>${changes.has(`${group}-${i}`)?'<span class="tag">Alterado</span>':''}</span>${mode==='fixed'?`<span class="actionline"><b>Programa ${page*4+i}</b></span><div class="device">Número fixo neste modo</div>`:`<span class="actionline"><span>Toque</span><b>${h(name(groups[group][i].tap))}</b></span><span class="actionline"><span>Segure</span><b>${h(name(groups[group][i].hold))}</b></span><div class="device">${groups[group][i].tap.device==='m5'?'Line 6 M5':'MIDI manual'}</div>`}</button>`).join('')}</div>`}
function inspector(){const a=item();return `<section class="inspector" aria-label="Editor do botão ${letters[selected]}"><div class="inspecthead"><div class="keycap">${letters[selected]}</div><div><h2>Botão ${letters[selected]}</h2><p>${mode==='fixed'?'Presets em sequência':'Escolha o que ele faz no equipamento'}</p></div></div>${mode==='fixed'?`<div class="form"><div class="explain wide"><b>Este botão envia o programa ${page*4+selected}.</b><br>Neste modo, A–D seguem a sequência de números do Chocolate.</div><label class="field wide">Interpretar para qual equipamento?<select id="fixedDevice"><option>Line 6 M5</option><option>MIDI genérico</option></select></label><div class="result wide" id="fixedResult"><b>${page*4+selected<24?`No M5: selecionar preset ${page*4+selected+1}`:'Fora dos 24 presets documentados do M5'}</b><p>Canal ${channel}. O nome do timbre não é lido pelo Chocolate.</p></div><button class="primary wide" data-do="personalize">Personalizar este botão</button><p class="small muted wide">Para escolher outras ações ou usar toque e segurar, mude o controlador para ações personalizadas.</p></div>`:`<div class="form"><div class="tabs" aria-label="Gesto"><button data-gesture="tap" aria-pressed="${gesture==='tap'}">Ao tocar</button><button data-gesture="hold" aria-pressed="${gesture==='hold'}">Ao segurar</button></div><label class="field wide">Equipamento<select id="device"><option value="m5" ${a.device==='m5'?'selected':''}>Line 6 M5</option><option value="manual" ${a.device==='manual'?'selected':''}>Outro equipamento · MIDI manual</option></select></label><label class="field wide">Ação<select id="action">${a.device==='m5'?Object.entries(actionLabels).map(([k,v])=>`<option value="${k}" ${a.action===k?'selected':''}>${v}</option>`).join(''):[['pc','Selecionar programa (PC)'],['cc','Enviar controle (CC)'],['none','Sem ação']].map(([k,v])=>`<option value="${k}" ${a.action===k?'selected':''}>${v}</option>`).join('')}</select></label>${['preset','expression','pc','cc'].includes(a.action)?`<div class="fieldrow wide"><label class="field">${a.action==='preset'?'Número do preset':a.action==='expression'?'Posição':a.action==='pc'?'Programa':'Controle'}<input id="number" required type="number" min="${a.action==='preset'?1:0}" max="${a.action==='preset'?24:127}" value="${a.number}" aria-describedby="numberHint"><small id="numberHint">${a.action==='preset'?'De 1 a 24, como no M5':'De 0 a 127'}</small></label>${a.action==='cc'?`<label class="field">Valor<input id="ccValue" required type="number" min="0" max="127" value="${a.value??127}"></label>`:''}</div>`:''}<div class="result"><b>${gesture==='tap'?'Ao tocar':'Ao segurar'} ${letters[selected]}: ${h(name(a))}</b><p>${a.action==='none'?'Este gesto não envia uma mensagem.':`${a.device==='m5'?'Line 6 M5':'Destino MIDI'} · canal ${channel}`} ${a.action==='tap'?'Toque duas ou mais vezes para marcar o tempo.':''}${a.action==='expression'?'Usa a expressão já configurada no preset do M5.':''}</p></div><button class="textbutton" data-do="midi">${showMidi?'Ocultar MIDI':'Ver MIDI e canal'}</button>${showMidi?`<div class="explain wide mono">${midi(a)}<button class="textbutton" data-do="destination">Ajustar canal e conexão do equipamento</button></div>`:''}</div>`}</section>`}
function midi(a){if(a.action==='none')return 'Nenhuma mensagem';if(a.action==='preset'||a.action==='pc')return `Program Change ${a.action==='preset'?a.number-1:a.number} · canal ${channel}`;const map={tap:[64,127],on:[11,127],off:[11,0],tuner:[69,127],exit:[69,0],expression:[1,a.number],cc:[a.number,a.value??127]};const [n,v]=map[a.action]||[0,0];return `Control Change ${n} · valor ${v} · canal ${channel}`}
function editor(){if(!['connected','disconnected'].includes(connection))return entry();const dirty=changes.size||modeChanged;return `${appbar()}<main class="shell"><div class="devicebar"><div><h1>Chocolate Plus</h1><div class="connection" style="${connection==='disconnected'?'color:#9a422b':''}"><span class="dot"></span>${connection==='connected'?'Conectado por USB':'Desconectado'}<button class="quiet small" data-do="connection" aria-label="Detalhes da conexão" style="min-height:28px;padding:0 4px">⌄</button></div></div><button class="modeButton" data-do="modes">Modo de operação<b>${mode==='fixed'?'Presets em sequência':'Ações personalizadas'} <em>Alterar ↗</em></b></button></div>${connection==='disconnected'?'<div class="alert">Sua edição está aqui. Reconecte o Chocolate para salvar.</div>':''}${modeChanged?`<div class="alert">Modo alterado para ${modeName(mode).toLowerCase()}. Ao salvar, a mudança valerá para o controlador inteiro.</div>`:''}<div class="workspace"><div class="boardarea"><div class="boardtoolbar"><span>${mode==='fixed'?'Visualização':'Configuração de botões'} <b class="mono">${mode==='fixed'?`${String(page*4).padStart(3,'0')}–${String(page*4+3).padStart(3,'0')}`:`${group+1} de 8`}</b></span><div class="row"><button data-do="prev" aria-label="Visualização anterior" ${(mode==='fixed'?page:group)===0?'disabled':''}>←</button><button data-do="next" aria-label="Próxima visualização" ${(mode==='fixed'?page:group)===(mode==='fixed'?31:7)?'disabled':''}>→</button></div></div>${hardware()}<p class="boardhint">${mode==='fixed'?'No pedal: E volta quatro números · F avança quatro números. Aqui, as setas mudam apenas a visualização.':'Clique em um botão para editar. A visualização representa sua configuração, não o visor ao vivo do pedal.'}</p>${summaries()}</div>${inspector()}</div><footer class="savebar"><div class="status" role="status" aria-live="polite">${saving?'Salvando…':saved?'✓ Salvo no Chocolate':dirty?`${changes.size?`${changes.size} ${changes.size===1?'botão alterado':'botões alterados'}`:'Modo alterado'} · não salvo`:'Nenhuma alteração para salvar'}<small>${saving?'Gravando e conferindo a configuração simulada.':saved?'Você pode continuar editando.':'As alterações chegam ao pedal quando você salva.'}</small></div><div class="actions"><button class="quiet" data-do="changes" ${!dirty||saving?'disabled':''}>Ver alterações</button><button class="primary" data-do="save" ${!dirty||saving?'disabled':''}>${connection==='disconnected'?'Reconectar para salvar':'Salvar no Chocolate'}</button></div></footer></main>`}
function flows(){return `<main class="doc"><span class="eyebrow">Modelo de interação proposto</span><h1>Uma tela para configurar.<br>Ferramentas ao redor da tarefa.</h1><p>O caminho principal termina no botão que você quer editar. A conexão e a leitura acontecem juntas; modo, arquivos e preferências não viram etapas obrigatórias.</p><h2>1. Entrar no editor</h2><div class="flow"><div class="step"><small>ABRIR</small><b>Descoberta automática</b><p>Com permissão anterior, o app busca o dispositivo.</p></div><div class="step"><small>PRIMEIRA VEZ, SE NECESSÁRIO</small><b>Conectar Chocolate</b><p>Uma ação para pedir acesso ao navegador.</p></div><div class="step"><small>AUTOMÁTICO</small><b>Identificar e ler</b><p>Guardar uma cópia de recuperação.</p></div><div class="step"><small>PRONTO</small><b>Abrir o controlador</b><p>Mostrar o modo e a configuração que já existem.</p></div></div><h2>2. Escolher o resultado do botão</h2><div class="flow"><div class="step"><small>01</small><b>Clicar em A</b><p>O painel mostra as ações do botão.</p></div><div class="step"><small>02</small><b>Ao tocar / Ao segurar</b><p>Escolher o gesto que quer alterar.</p></div><div class="step"><small>03</small><b>Equipamento → ação</b><p>Ex.: M5 → selecionar preset → 1.</p></div><div class="step"><small>04</small><b>Salvar no Chocolate</b><p>Conferir a gravação e permanecer no editor.</p></div></div><div class="scope"><b>Se o modo atual tiver funções fixas:</b> mostramos o que A faz de verdade. “Personalizar este botão” explica que será preciso mudar o modo do controlador inteiro. Nenhuma promessa de 128 botões livremente configuráveis.</div><h2>3. Resolver somente a exceção que aconteceu</h2><div class="flow"><div class="step"><b>Nenhum dispositivo</b><p>Instrução de cabo/USB e Atualizar.</p></div><div class="step"><b>Vários dispositivos</b><p>Escolha do controlador; detalhes de portas se necessário.</p></div><div class="step"><b>Desconexão</b><p>Manter edição. Reconectar e reler antes de gravar.</p></div><div class="step"><b>Conflito</b><p>Comparar alterações, sem sobrescrever silenciosamente.</p></div></div><h2>O que sai do caminho principal</h2><p>Nome obrigatório de projeto, confirmação genérica de portas, botões separados de ler e continuar, banners sobre estados internos e uma revisão em outra tela para toda alteração.</p><h2>O que continua protegido</h2><p>Identidade do controlador, backup, preservação de campos desconhecidos, comparação antes da gravação e releitura exata. Simplificar a interface não remove essas verificações.</p><h2>Como decidir se ficou melhor</h2><p>Testar com iniciantes: configurar A para preset 1 ao tocar e preset 2 ao segurar; explicar o resultado; salvar; desconectar e retomar. Meta proposta: 4 de 5 concluem em até 3 minutos, sem explicar PC/CC. Ainda não houve esse teste.</p><div class="scope">A maquete detalha dois modos e é toda simulada. A especificação cobre os treze modos, importação, recuperação, idiomas e critérios de acessibilidade. A implementação depende da revisão desta proposta.</div><button class="primary" data-do="try">Experimentar a primeira conexão</button></main>`}
function research(){return `<main class="doc"><span class="eyebrow">Pesquisa · fontes oficiais · 08.11.2026</span><h1>Editar o objeto primeiro.<br>Administrar arquivos depois.</h1><p>Estudo documental e inspeção de imagens de cinco editores. As conclusões abaixo são decisões propostas para o Chocolate, não resultados de um teste de usabilidade desses produtos.</p><div class="research"><article><h3>Morningstar Editor</h3><p>É o paralelo mais próximo: um editor de controlador MIDI com ações, gestos e um dicionário por marca, modelo e função.</p><p><b>Aplicação:</b> escolher a função musical e traduzir os comandos por perfil. Evitar a densidade de mensagens e abas.</p><a href="https://help.morningstar.io/en/article/morningstar-editor-user-manual-81kpjn/" target="_blank" rel="noopener">Manual do editor ↗</a></article><article><h3>Fractal FM3-Edit</h3><p>A visão de controladores mostra switches, seleção e funções de toque/segurar. O objeto físico ancora a edição.</p><p><b>Aplicação:</b> Chocolate à esquerda, botão selecionado à direita. Sem copiar uma cadeia de áudio ou seus muitos parâmetros.</p><a href="https://www.fractalaudio.com/fm3-edit/" target="_blank" rel="noopener">FM3-Edit ↗</a></article><article><h3>Neural DSP Cortex Control</h3><p>O fabricante descreve abertura sincronizada com o estado do equipamento e seleção direta dos elementos da grade.</p><p><b>Aplicação:</b> abrir a configuração existente. Não prometer edição instantânea ou trocar o destino de alterações automaticamente.</p><a href="https://neuraldsp.com/cortex-control" target="_blank" rel="noopener">Cortex Control ↗</a></article><article><h3>Line 6 HX Edit</h3><p>Command Center relaciona controles físicos e comandos. Salvar no aparelho é uma operação diferente de exportar arquivo.</p><p><b>Aplicação:</b> funções por botão e um destino explícito para Salvar. Arquivos ficam em outra ferramenta.</p><a href="https://l6c-acdn2.line6.net/data/6/0a020a3f137e660b4f6a285cb7/application/pdf/HX%20Edit%203.%E2%80%8B11%20Pilot%27s%20Guide%20-%20English%20.pdf" target="_blank" rel="noopener">Manual HX Edit ↗</a></article><article><h3>BOSS Tone Studio</h3><p>Edição e WRITE ficam na área do som; Librarian organiza cópias e LiveSets.</p><p><b>Aplicação:</b> gravação clara e previsível. Não transformar biblioteca ou conteúdo em uma etapa da configuração.</p><a href="https://articles.boss.info/getting-started-boss-tone-studio-and-katana/" target="_blank" rel="noopener">Guia oficial ↗</a></article><article><h3>O limite do navegador</h3><p>Web MIDI oferece listas de portas e eventos de conexão. Permissão de MIDI/SysEx continua necessária.</p><p><b>Aplicação:</b> carregar automaticamente quando autorizado e tratar permissão, busca e ausência como estados distintos.</p><a href="https://developer.mozilla.org/en-US/docs/Web/API/Navigator/requestMIDIAccess" target="_blank" rel="noopener">Web MIDI / MDN ↗</a></article></div><div class="scope"><b>Recomendação:</b> editor direto, ações orientadas ao resultado e detalhes técnicos por demanda. Um wizard obrigatório mais curto ainda deixaria o usuário atravessando etapas antes de editar. Receitas prontas podem ser opcionais, dentro do editor.</div></main>`}
function render(){const active=document.activeElement;const focusKey=active?.id?`#${active.id}`:active?.dataset.switch!==undefined?`button.switch[data-switch="${active.dataset.switch}"]`:active?.dataset.gesture?`[data-gesture="${active.dataset.gesture}"]`:null;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#page').innerHTML=view==='editor'?editor():view==='flows'?flows():research();$('#scenario').value=scenario;if(focusKey)$(focusKey)?.focus({preventScroll:true})}
function modal(title,body,footer=''){openSource=document.activeElement;$('#dialog').innerHTML=`<div class="dialoghead"><h2 id="dialogTitle">${title}</h2><button class="quiet" data-do="close" aria-label="Fechar">✕</button></div><div class="dialogbody">${body}</div>${footer?`<div class="dialogfoot">${footer}</div>`:''}`;if(!$('#dialog').open)$('#dialog').showModal()}
function close(){if($('#dialog').open)$('#dialog').close();if(openSource?.isConnected)openSource.focus()}
function modeDialog(){modal('Como você quer usar o Chocolate?',`<div class="modegroup"><h3>MIDI</h3><button class="choice" data-do="fixed" aria-pressed="${mode==='fixed'}"><b>Presets em sequência</b><span>A–D percorrem os programas 000–127. Program change A.</span></button><button class="choice" data-do="personalize" aria-pressed="${mode==='custom'}"><b>Ações personalizadas</b><span>Escolha ações por botão e gesto. Advanced custom mode.</span></button></div><div class="modegroup"><h3>Outros modos na especificação</h3><p>Controles MIDI em sequência · Quatro comandos personalizados · Controle M-VAVE · Gestos Android · Vídeo · Setas · Navegação · Mídia · Atalhos personalizados · MIDI e teclado · Caixa de som.</p><p>Os painéis desses onze modos serão detalhados na próxima rodada de desenho. Esta maquete não os implementa.</p></div>`)}
function personalize(){if(mode==='custom'){close();return}modal('Personalizar as ações do Chocolate',`<p>Para escolher o que cada botão faz ao tocar ou segurar, o controlador precisa usar <b>Ações personalizadas</b>.</p><div class="explain">A mudança vale para <b>A, B, C e D</b>. A navegação deixa de ser a sequência fixa de programas 000–127.</div><p class="small muted">As atribuições personalizadas já armazenadas serão mostradas. A troca só chega ao pedal quando você salvar.</p>`,`<button data-do="close">Manter modo atual</button><button class="primary" data-do="confirmCustom">Usar ações personalizadas</button>`)}
function summaryChanges(){let rows=[...changes].map(k=>{const [g,i]=k.split('-').map(Number);return `<div class="listitem"><b>Botão ${letters[i]} · configuração ${g+1}</b><small>Toque: ${h(name(groups[g][i].tap))} · Segure: ${h(name(groups[g][i].hold))}</small></div>`}).join('');return `${modeChanged?`<div class="listitem"><b>Modo de operação</b><small>${modeName(initialMode)} → ${modeName(mode)}</small></div>`:''}${rows||(!modeChanged?'<p>Nenhuma alteração.</p>':'')}`}
function connect(){modal('Abrindo o Chocolate',`<p role="status">Identificando o controlador e lendo a configuração…</p><p class="small muted">Simulação: nenhuma permissão é solicitada e nenhum dado é enviado ao pedal.</p>`);setTimeout(()=>{close();connection='connected';if(scenario==='first')mode='fixed';saved=false;render()},700)}
const commands={close,connect,personalize,modes:modeDialog,confirmCustom(){close();mode='custom';modeChanged=mode!==initialMode;saved=false;group=0;gesture='tap';render()},fixed(){if(mode==='fixed'){close();return}modal('Usar presets em sequência?',`<p>Os quatro botões voltarão a selecionar números fixos. As ações personalizadas ficarão armazenadas, mas inativas.</p><p class="small muted">A troca ainda precisa ser salva no Chocolate.</p>`,`<button data-do="close">Cancelar</button><button class="primary" data-do="confirmFixed">Usar sequência</button>`)},confirmFixed(){close();mode='fixed';modeChanged=mode!==initialMode;saved=false;render()},prev(){if(mode==='fixed')page=Math.max(0,page-1);else group=Math.max(0,group-1);render()},next(){if(mode==='fixed')page=Math.min(31,page+1);else group=Math.min(7,group+1);render()},midi(){showMidi=!showMidi;render()},changes(){modal('Alterações para salvar',summaryChanges(),`<button data-do="close">Continuar editando</button><button class="primary" data-do="save">Salvar no Chocolate</button>`)},save(){const numberField=$('#number');if(numberField&&!numberField.checkValidity()){numberField.reportValidity();return}const valueField=$('#ccValue');if(valueField&&!valueField.checkValidity()){valueField.reportValidity();return}if(connection==='disconnected'){connect();return}close();if(scenario==='conflict'){modal('O Chocolate mudou desde a leitura',`<p>Há uma mudança feita fora deste editor. Não gravamos por cima dela.</p><div class="explain"><b>Exemplo simulado</b><br>Canal do controlador: 1 → 2<br>Sua edição: botão A, segurar → Preset 2</div><p>Releia o controlador antes de reaplicar sua edição. Sua versão ficará na recuperação.</p>`,`<button data-do="close">Continuar editando</button><button class="primary" data-do="resolveConflict">Reler e comparar</button>`);return}saving=true;render();setTimeout(()=>{saving=false;changes.clear();modeChanged=false;initialMode=mode;saved=true;render()},900)},resolveConflict(){close();scenario='custom';channel=2;modal('Sua edição foi mantida',`<p>O exemplo agora usa o canal 2 lido do controlador e mantém a alteração do botão A. Revise antes de salvar.</p><p class="small muted">Em um conflito real, somente mudanças compatíveis seriam reaplicadas sobre a nova leitura.</p>`,`<button class="primary" data-do="closeRender">Voltar à edição</button>`)},closeRender(){close();render()},files(){modal('Configurações',`<p class="muted small">Uma cópia permite levar sua configuração para outro navegador ou voltar a ela depois.</p><button class="choice" data-do="download"><b>Baixar uma cópia</b><span>Guardar a configuração e os nomes dos equipamentos.</span></button><button class="choice" data-do="import"><b>Abrir configuração</b><span>Escolher um arquivo antes de substituir a edição.</span></button><button class="choice" data-do="history"><b>Histórico de recuperação</b><span>Cópias guardadas antes de gravar no Chocolate.</span></button><p class="small muted">Nesta maquete, os arquivos também são simulados.</p>`)},download(){modal('Cópia da configuração',`<label class="field">Nome do arquivo<input value="chocolate-configuracao.json" readonly></label><p>A versão real baixará a cópia pelo navegador. Nenhum arquivo é gerado nesta simulação.</p>`,`<button class="primary" data-do="close">Entendi</button>`)},import(){modal('Abrir configuração de exemplo?',`<p>Exemplo: ações MIDI personalizadas, quatro botões e Line 6 M5.</p><p>Substitui a edição aberta. Não grava no Chocolate. Na aplicação, você escolherá um arquivo e verá sua compatibilidade antes de abrir.</p>`,`<button data-do="close">Cancelar</button><button class="primary" data-do="loadExample">Abrir exemplo</button>`)},loadExample(){close();connection='connected';mode='custom';groups=createGroups();changes=new Set(['0-0','0-1','0-2','0-3']);selected=0;group=0;modeChanged=true;saved=false;render()},history(){modal('Histórico de recuperação',`<div class="listitem"><b>Antes da última gravação</b><small>Chocolate Plus · hoje, 14:32 · exemplo simulado</small></div><p>Restaurar uma cópia real exigirá validar o dispositivo e revisar as mudanças. Essa operação não é executada na maquete.</p>`,`<button data-do="close">Voltar à edição</button>`)},settings(){modal('Ajustes do Chocolate',`<button class="choice" data-do="modes"><b>Modo de operação</b><span>${mode==='fixed'?'Presets em sequência':'Ações personalizadas'}</span></button><button class="choice" data-do="destination"><b>Canal e equipamento</b><span>Usar o mesmo canal no Chocolate e no destino.</span></button><button class="choice" data-do="advanced"><b>Pedal externo e outros ajustes</b><span>Opções do controlador por modo.</span></button>`)},destination(){modal('Canal do equipamento',`<label class="field">Canal MIDI<select id="channel">${Array.from({length:16},(_,i)=>`<option ${channel===i+1?'selected':''}>${i+1}</option>`).join('')}</select><small>Precisa ser o mesmo configurado no equipamento que recebe os comandos.</small></label><div class="explain"><b>Line 6 M5</b><br>A conexão deve chegar ao MIDI IN do M5. O canal não é detectado automaticamente. A ajuda do perfil explicará onde ajustá-lo no aparelho.</div><p class="small muted">Nesta maquete, o canal é compartilhado para simplificar o exemplo. O produto deve respeitar o canal de cada destino/ação suportada.</p>`,`<button class="primary" data-do="closeRender">Voltar ao botão</button>`)},advanced(){modal('Ajustes por modo',`<p>Pedal externo, intervalo de seleção e demais ajustes observados terão um painel próprio, organizado por assunto.</p><p class="small muted">Este painel ainda não está desenhado em detalhe. A especificação exige acesso a todos os campos suportados, sem preencher a área de edição de botões.</p>`,`<button data-do="close">Voltar</button>`)},preferences(){modal('Preferências',`<label class="field">Idioma<select disabled><option>Português</option><option>English</option></select><small>O produto seguirá o navegador e lembrará sua escolha. Esta maquete está em português.</small></label><p class="small muted">Sem conta. As configurações ficam no navegador até você baixar uma cópia.</p>`)},connection(){modal('Chocolate Plus',`<div class="explain"><b>${connection==='connected'?'Conectado por USB':'Desconectado'}</b><br>Dispositivo identificado · configuração disponível<br><small>Estado simulado para revisão da interface.</small></div><button class="choice" data-do="refresh"><b>Atualizar dispositivos</b><span>A aplicação também acompanha conexões automaticamente.</span></button><button class="textbutton" data-do="manual">Ver portas MIDI</button>`)},refresh(){modal('Dispositivos disponíveis',`<button class="choice" data-do="connect"><b>Chocolate Plus · USB</b><span>Dispositivo de exemplo encontrado.</span></button>`)},manual(){modal('Portas MIDI',`<p class="small muted">Use esta opção quando não for possível identificar o par automaticamente.</p><label class="field">Entrada<select><option>SINCO — entrada (exemplo)</option></select></label><label class="field">Saída<select><option>SINCO — saída (exemplo)</option></select></label><p class="small muted">O aplicativo ainda verificará a identidade do controlador. O nome da porta, sozinho, não comprova compatibilidade.</p>`,`<button class="primary" data-do="connect">Conectar e abrir</button>`)},help(){modal('Conectar por USB',`<p>1. Ligue o Chocolate e conecte um cabo USB que transmita dados.</p><p>2. Verifique a permissão MIDI deste site no navegador.</p><p>3. Se necessário, feche outro editor que esteja usando a conexão e atualize os dispositivos.</p>`,`<button class="primary" data-do="connect">Atualizar dispositivos</button>`)},try(){view='editor';reset('first')}};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render();return}if(b.dataset.switch!==undefined){selected=Number(b.dataset.switch);render();return}if(b.dataset.gesture){gesture=b.dataset.gesture;render();return}if(b.dataset.do)commands[b.dataset.do]?.()});
document.addEventListener('input',e=>{const t=e.target;if(!['number','ccValue'].includes(t.id))return;const valid=t.checkValidity();t.setAttribute('aria-invalid',String(!valid));let error=$('#fieldError');if(!valid){if(!error){error=document.createElement('span');error.id='fieldError';error.className='error';t.parentElement.append(error)}error.textContent=`Informe um número de ${t.min} a ${t.max}.`;document.querySelectorAll('[data-do=save]').forEach(b=>b.disabled=true);return}error?.remove();item()[t.id==='number'?'number':'value']=Number(t.value);mark();$('.summaries').outerHTML=summaries();const result=$('.inspector .result');result.innerHTML=`<b>${gesture==='tap'?'Ao tocar':'Ao segurar'} ${letters[selected]}: ${h(name(item()))}</b><p>${item().device==='m5'?'Line 6 M5':'Destino MIDI'} · canal ${channel}</p>`;$('.savebar .status').innerHTML=`${changes.size} ${changes.size===1?'botão alterado':'botões alterados'} · não salvo<small>As alterações chegam ao pedal quando você salva.</small>`;document.querySelectorAll('.savebar button').forEach(b=>b.disabled=false)});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='scenario'){reset(t.value);return}if(t.id==='fixedDevice'){$('#fixedResult').innerHTML=t.selectedIndex===0?`<b>${page*4+selected<24?`No M5: selecionar preset ${page*4+selected+1}`:'Fora dos 24 presets documentados do M5'}</b><p>Canal ${channel}. O nome do timbre não é lido pelo Chocolate.</p>`:`<b>Program Change ${page*4+selected}</b><p>Canal ${channel}. Consulte a tabela MIDI do equipamento.</p>`;return}if(t.id==='channel'){channel=Number(t.value);mark();return}const a=item();if(t.id==='device'){a.device=t.value;a.action=t.value==='m5'?'preset':'pc';a.number=t.value==='m5'?1:0;mark();render()}if(t.id==='action'){a.action=t.value;a.number=a.action==='preset'?1:0;mark();render()}if(t.id==='number'||t.id==='ccValue'){if(!t.checkValidity()){t.reportValidity();return}a[t.id==='number'?'number':'value']=Number(t.value);mark();render()}});
render();
</script></body></html>
