<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chocolate Studio — proposta de configuração guiada</title>
<style>
:root{color-scheme:dark;--bg:#17191a;--panel:#222627;--line:#424747;--text:#f1eee6;--muted:#b6bbb9;--accent:#e2b878}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}button,input,select{font:inherit}button,select,input{min-height:46px;border:1px solid var(--line);border-radius:7px;background:#1c2021;color:var(--text);padding:10px 14px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #f5d096;outline-offset:4px}button.primary{background:var(--accent);color:#211d15;border-color:var(--accent);font-weight:650}button:disabled{opacity:.5;cursor:default}button.quiet{background:transparent}a{color:var(--accent)}.notice{background:#2c2820;border-bottom:1px solid #655139;padding:10px 24px;font-size:13px;text-align:center}.wrap{max-width:1000px;margin:auto;padding:24px}header{display:flex;gap:18px;align-items:center;justify-content:space-between;padding:0 0 22px;border-bottom:1px solid var(--line)}.brand{font-size:19px;font-weight:650}small,.muted{color:var(--muted)}main{max-width:790px;margin:38px auto}h1{font-size:28px;line-height:1.2;margin:10px 0 14px}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 12px}p{margin:10px 0 20px}.eyebrow{font-size:13px;color:var(--muted)}.panel{background:var(--panel);border:1px solid #373d3e;border-radius:10px;padding:24px;margin:18px 0}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}.stack{display:grid;gap:10px}label{display:grid;gap:7px}label small{font-size:13px}.actions{display:flex;gap:12px;justify-content:space-between;margin-top:24px}.choice{display:grid;grid-template-columns:24px 1fr;gap:14px;padding:18px;border:1px solid var(--line);border-radius:8px;cursor:pointer}.choice:has(input:checked){border-color:var(--accent);background:#302d25}.choice input{accent-color:var(--accent);min-height:24px;margin:3px 0;width:20px}.choice span{display:grid}.choice small{font-size:14px}details{margin:18px 0;color:var(--muted)}summary{cursor:pointer;min-height:44px;padding:10px 0;color:var(--text)}.feedback{border-left:3px solid var(--accent);padding:10px 16px;background:#302d25}.error{border-color:#ffb9a2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.chassis{background:linear-gradient(#252829,#0c0e0f 42%,#0f1213);border:1px solid #484b4b;border-bottom:6px solid #090b0c;border-radius:5px;padding:18px 12px 8px;margin:24px 0 12px}.wordmark{font-size:9px;letter-spacing:2px;text-align:center;color:#bbb;margin-bottom:12px}.switches{display:grid;grid-template-columns:1fr 1fr .65fr 1fr 1fr;gap:4px;position:relative;align-items:center}.switch{padding:7px 0;background:transparent;border:0;min-width:44px;min-height:88px;position:relative;z-index:1}.metal{display:block;width:clamp(30px,7vw,55px);aspect-ratio:1;margin:0 auto 8px;border-radius:50%;border:3px solid #333b3d;box-shadow:0 0 0 1px #8e9698,inset 0 0 0 4px #c0c6c8,inset 2px 4px 8px #f0f3f4;background:linear-gradient(135deg,#f1f4f4,#818b8e 60%,#d9e1e2)}.switch[aria-pressed=true] .metal{box-shadow:0 0 0 2px var(--accent),inset 0 0 0 4px #c0c6c8,inset 2px 4px 8px #f0f3f4}.switch[aria-pressed=true]{color:var(--accent)}.display{text-align:center;background:#0b0e0f;border:1px solid #333;padding:8px 0;max-width:66px;min-width:34px;margin:auto;width:100%;font-size:9px;color:var(--accent)}.display strong{display:block;color:#eee;font-size:28px}.bridge{position:absolute;top:31px;width:21%;border-top:1px solid #656a6b;left:11%;font-size:9px;color:#bbb;text-align:center}.bridge span{position:relative;top:-9px;background:#131617;padding:0 7px}.bridge.f{left:68%}.assignment-note{text-align:center;font-size:13px}.tag{border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.review{width:100%;border-collapse:collapse}.review th,.review td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:12px 8px}.toggle{display:flex;align-items:center;gap:10px;margin-bottom:20px}.toggle input{min-height:24px;width:20px;accent-color:var(--accent)}.help{font-size:14px;color:var(--muted)}footer{padding:24px 0;font-size:13px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:540px){.wrap{padding:16px}header{align-items:flex-start}main{margin:24px auto}.panel{padding:16px}.grid{grid-template-columns:1fr}h1{font-size:24px}.switch{min-height:78px}.actions{flex-wrap:wrap}.actions button{flex:1}.notice{padding:8px 12px}.review th,.review td{padding:10px 4px;font-size:14px}}
</style>
<div class="notice"><strong>Protótipo para discussão.</strong> Dados e conexão simulados. Nada é enviado ou gravado no pedal.</div>
<div class="wrap"><header><span class="brand">Chocolate Studio</span><span id="connection" class="tag">Sem conexão simulada</span></header><main id="screen"></main><footer>Proposta em português · a implementação terá PT-BR e inglês · <a href="../../../docs/product/guided-experience.md">Especificação do fluxo</a></footer></div>
<script>
// Prototype-only state. No Web MIDI, storage, network requests or application imports.
const screen=document.querySelector('#screen');let step=1,connected=false,read=false,error=false,target='m5',channel=1,selected='A',held=false;
let switches=Object.fromEntries(['A','B','C','D'].map((id,i)=>[id,{tap:'preset',tapValue:i+1,hold:'preset',holdValue:2,held:false}]));
const drafts={m5:switches,advanced:Object.fromEntries(['A','B','C','D'].map(id=>[id,{tap:'pc',tapValue:0,hold:'pc',holdValue:1,held:false}]))};
const labels={preset:'Selecionar preset',on:'Ligar efeito',off:'Desligar efeito',tunerOn:'Abrir afinador',tunerOff:'Fechar afinador',tempo:'Marcar tap tempo',expression:'Definir posição da expressão',pc:'Program Change',cc:'Control Change'};
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
function options(value){return (target==='m5'?['preset','on','off','tunerOn','tunerOff','tempo','expression']:['pc','cc']).map(k=>`<option value="${k}" ${k===value?'selected':''}>${labels[k]}</option>`).join('')}
function actionText(type,value){if(type==='preset')return 'Selecionar preset '+value;if(type==='expression')return 'Expressão: '+value+' de 127';if(type==='pc')return 'Program Change '+value;if(type==='cc')return 'Control Change '+value+' · valor 127';return labels[type]}
function midi(type,value){const codes={on:[11,127],off:[11,0],tunerOn:[69,127],tunerOff:[69,0],tempo:[64,127],expression:[1,Number(value)],cc:[Number(value),127]};return type==='preset'||type==='pc'?{type:'pc',channel,program:Number(value)-(type==='preset'?1:0)}:{type:'cc',channel,controller:codes[type][0],value:codes[type][1]}}
function field(kind){const sw=switches[selected],type=sw[kind],value=sw[kind+'Value'];const numeric=['preset','expression','pc','cc'].includes(type);return `<div><h3>${kind==='tap'?'Ao tocar':'Ao segurar'}</h3><label>Ação<select data-kind="${kind}" aria-label="Ação ${kind==='tap'?'ao tocar':'ao segurar'}">${options(type)}</select></label>${numeric?`<label style="margin-top:14px">${type==='preset'?'Preset da M5':type==='cc'?'Número do controle':'Valor'}<input aria-label="${type==='preset'?'Preset da M5':type==='cc'?'Número do controle':'Valor'} ${kind==='tap'?'ao tocar':'ao segurar'}" data-value="${kind}" type="number" min="${type==='preset'?1:0}" max="${type==='preset'?24:127}" value="${value}" required><small>${type==='preset'?'Use o número que aparece na M5, de 1 a 24.':type==='cc'?'Neste protótipo, o valor enviado é fixo em 127. O editor avançado completo terá valor editável.':'Faixa MIDI: 0 a 127.'}</small></label>`:''}${type==='expression'?'<p class="help">Controla os parâmetros atribuídos à expressão no preset da M5. Os limites precisam ser preparados na própria M5.</p>':''}${type==='tempo'?'<p class="help">Cada acionamento marca uma batida. O tempo da pisada precisa ser validado no controlador antes da implementação.</p>':''}</div>`}
function render(focus=true){document.querySelector('#connection').textContent=read&&!connected?'Desconectado · rascunho preservado':read?'Chocolate Plus · exemplo carregado':connected?'Chocolate Plus · conexão simulada':'Sem conexão simulada';let html='';
if(step===1)html=`<div class="eyebrow">Etapa 1 de 2 · Conectar o controlador</div><h1 tabindex="-1">Conecte seu Chocolate Plus</h1><p>Conecte o controlador ao computador por USB. Primeiro vamos carregar o que já está nele.</p><div class="panel">${error?'<div role="alert" class="feedback error">Não foi possível ler a configuração simulada. Verifique o cabo e tente novamente. Nenhuma alteração foi feita.</div>':connected?'<div class="feedback">Controlador encontrado na simulação: Chocolate Plus</div>':'<p>O sistema vai procurar um Chocolate compatível. A escolha manual das portas fica disponível se houver mais de um.</p>'}<div class="actions"><button data-do="connect">${connected?'Buscar novamente':'Simular busca do controlador'}</button><button class="primary" data-do="read" ${connected?'':'disabled'}>Simular leitura e continuar</button></div></div><details><summary>Não encontrou o controlador?</summary><p>Conferir cabo, modo USB e permissão MIDI do navegador. Não pedir para escolher entradas e saídas desconhecidas antes de tentar identificar o controlador.</p><button data-do="error">Explorar falha de leitura</button></details><p class="help">No produto, a leitura preservará uma cópia antes de qualquer gravação. Neste protótipo, usamos apenas dados de exemplo.</p>`;
if(step===2)html=`<div class="eyebrow">Etapa 2 de 2 · Escolher o equipamento</div><h1 tabindex="-1">O que você vai controlar?</h1><p>Escolha o equipamento para configurar usando nomes de ações.</p><p class="help">Neste protótipo, cada opção usa um rascunho simulado separado. Você pode voltar sem perder a edição da M5.</p><div class="stack"><label class="choice"><input type="radio" name="target" value="m5" ${target==='m5'?'checked':''}><span><strong>Line 6 M5</strong><small>Presets, afinador, efeito, tap tempo e expressão.</small></span></label><div class="choice" style="opacity:.65"><span aria-hidden="true">—</span><span><strong>TONEX · próxima etapa</strong><small>O catálogo precisa distinguir cada modelo. Ainda não selecionável.</small></span></div><label class="choice"><input type="radio" name="target" value="advanced" ${target==='advanced'?'checked':''}><span><strong>Outro equipamento / Avançado</strong><small>Configurar mensagens Program Change e Control Change.</small></span></label></div><div class="panel"><label>Canal MIDI do equipamento<select id="channel">${Array.from({length:16},(_,i)=>`<option ${channel===i+1?'selected':''}>${i+1}</option>`).join('')}</select><small>Use o mesmo canal configurado no equipamento. A seleção acima não detecta nem conecta a M5.</small></label><details><summary>Como a M5 recebe o comando?</summary><p>A M5 recebe MIDI pela entrada DIN. É preciso uma rota compatível entre a saída do Chocolate e essa entrada. A conexão USB ao computador, sozinha, não conecta a M5.</p><p>Na M5, confira o canal na tela MIDI do Setup. Este passo ajuda a preparar a rota; o teste físico vem depois.</p></details></div><div class="actions"><button data-do="back-connect">Voltar</button><button class="primary" data-do="editor">Editar os botões</button></div>`;
if(step===3){const sw=switches[selected];html=`<div class="row between"><div><div class="eyebrow">${target==='m5'?'Line 6 M5':'MIDI avançado'} · canal ${channel}</div><h1 tabindex="-1">Configure os botões</h1></div><button class="quiet" data-do="equipment">Trocar equipamento</button></div><p>Escolha um botão no Chocolate e defina o que ele faz.</p><div class="chassis"><div class="wordmark">CHOCOLATE PLUS</div><div class="switches" role="group" aria-label="Botões do Chocolate"><div class="bridge" aria-hidden="true"><span>E</span></div><div class="bridge f" aria-hidden="true"><span>F</span></div>${['A','B','C','D'].map(id=>`${id==='C'?`<div class="display" aria-label="Editando botão ${selected}">Editando<strong>${selected}</strong></div>`:''}<button class="switch" data-switch="${id}" aria-label="Editar botão ${id}" aria-pressed="${id===selected}"><span class="metal" aria-hidden="true"></span>${id}</button>`).join('')}</div></div><p class="assignment-note">E = A + B · F = C + D</p><form id="assignment" class="panel"><h2>Botão ${selected}</h2><label class="toggle"><input id="held" type="checkbox" ${sw.held?'checked':''}>Usar outra ação ao segurar</label><div class="grid">${field('tap')}${sw.held?field('hold'):''}</div>${sw.held?'<p class="help">Toque curto e toque longo usam ações diferentes. O tempo de reconhecimento depende do Chocolate e será verificado com uma pisada real.</p>':''}<details><summary>Ver os comandos MIDI</summary><pre>${esc(JSON.stringify({toque:midi(sw.tap,sw.tapValue),...(sw.held?{segurar:midi(sw.hold,sw.holdValue)}:{})},null,2))}</pre></details><div class="feedback" id="summary">${selected}: ${actionText(sw.tap,sw.tapValue)}${sw.held?' · Segurar: '+actionText(sw.hold,sw.holdValue):''}</div><div class="actions"><button type="button" data-do="equipment">Voltar ao equipamento</button><button class="primary" type="submit" ${connected?'':'disabled'}>Revisar configuração</button></div></form><details><summary>Mais opções</summary><p>Importar e baixar configuração, recuperar uma cópia e diagnóstico terão acesso secundário. Não estão implementados neste protótipo.</p><button data-do="disconnect">Explorar desconexão</button></details>`;}
if(step===4)html=`<div class="eyebrow">Revisão · simulação</div><h1 tabindex="-1">Confira antes de gravar</h1><p>${target==='m5'?'Line 6 M5':'Equipamento MIDI'} · canal ${channel}. Este resumo representa o exemplo, não o pedal conectado.</p><div class="panel"><table class="review"><thead><tr><th>Botão</th><th>Ao tocar</th><th>Ao segurar</th></tr></thead><tbody>${Object.entries(switches).map(([id,sw])=>`<tr><th>${id}</th><td>${actionText(sw.tap,sw.tapValue)}</td><td>${sw.held?actionText(sw.hold,sw.holdValue):'Sem ação adicional'}</td></tr>`).join('')}</tbody></table></div><p class="help">No produto: mostrar diferenças com a leitura original, criar cópia e verificar a gravação por releitura. O efeito real na M5 exige um teste separado.</p><div class="actions"><button data-do="editor">Voltar à edição</button><button class="primary" data-do="save">Simular gravação</button></div>`;
if(step===5)html=`<div class="eyebrow">Teste final · simulação</div><h1 tabindex="-1">Agora teste no equipamento</h1><div class="feedback">Fim da gravação simulada. Nenhum comando foi enviado.</div><p>Na versão real, toque no botão configurado e confira o resultado no equipamento. Se configurou outra ação ao segurar, teste as duas separadamente.</p><div class="panel"><h2>Exemplo de conferência</h2><p>Ao tocar em ${selected}: ${actionText(switches[selected].tap,switches[selected].tapValue)}.</p>${switches[selected].held?`<p>Ao segurar ${selected}: ${actionText(switches[selected].hold,switches[selected].holdValue)}.</p>`:''}<p class="help">Uma configuração lida corretamente não comprova que o som, preset ou afinador mudou na M5.</p></div><div class="actions"><button data-do="editor">Continuar editando</button><button data-do="help">Explorar “não funcionou”</button></div>`;
if(step===6)html=`<div class="eyebrow">Ajuda contextual · simulação</div><h1 tabindex="-1">Vamos conferir a conexão</h1><div class="panel"><ol><li>Confirme a rota MIDI até a entrada do equipamento.</li><li>Confira se o canal do equipamento é ${channel}.</li><li>Teste uma ação simples, como selecionar um preset.</li><li>Para toque longo, confirme o modo e se apenas a ação esperada acontece.</li></ol><p>O diagnóstico técnico só aparece se essas verificações não resolverem.</p></div><div class="row"><button class="primary" data-do="editor">Voltar à configuração preservada</button>${!connected?'<button data-do="back-connect">Reconectar Chocolate</button>':''}</div>`;
screen.innerHTML=html;if(focus)screen.querySelector('h1')?.focus();}
screen.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.switch){selected=b.dataset.switch;render(false);screen.querySelector(`[data-switch="${selected}"]`).focus();return;}switch(b.dataset.do){case'connect':connected=true;error=false;render();break;case'read':read=true;step=2;render();break;case'error':connected=true;error=true;render();break;case'back-connect':step=1;render();break;case'editor':step=3;render();break;case'equipment':step=2;render();break;case'save':step=5;render();break;case'help':step=6;render();break;case'disconnect':connected=false;step=6;render();break;}});
screen.addEventListener('change',e=>{const el=e.target;if(el.name==='target'){target=el.value;switches=drafts[target];render(false);screen.querySelector(`[value="${target}"]`).focus();}if(el.id==='channel')channel=Number(el.value);if(el.id==='held'){switches[selected].held=el.checked;render(false);screen.querySelector('#held').focus();}if(el.dataset.kind){const k=el.dataset.kind;switches[selected][k]=el.value;switches[selected][k+'Value']=el.value==='preset'?1:0;render(false);screen.querySelector(`[data-kind="${k}"]`).focus();}if(el.dataset.value&&el.checkValidity()){switches[selected][el.dataset.value+'Value']=Number(el.value);render(false);screen.querySelector(`[data-value="${el.dataset.value}"]`).focus();}});
screen.addEventListener('submit',e=>{e.preventDefault();if(e.target.reportValidity()){step=4;render();}});render(false);
</script>
</html>
