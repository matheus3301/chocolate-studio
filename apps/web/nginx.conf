# Full nginx configuration: paired with Dockerfile USER 101:101, not conf.d include.
# TLS terminates at the deployment proxy; Web MIDI still requires a secure origin.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # nginx >=1.29.3: local Cache-Control must not discard inherited security headers.
    add_header_inherit merge;

    server {
        listen 0.0.0.0:8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "midi=(self), camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

        location = /health {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store, no-transform" always;
            return 200 "ok\n";
        }

        # Vite emits content-hashed assets here. Missing assets are never app HTML.
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
        }

        location = /index.html {
            try_files $uri =404;
            add_header Cache-Control "no-cache, no-transform" always;
        }

        location ~ (^|/)\. {
            return 404;
        }

        # Other file-like URLs (favicon, manifests, fonts, etc.) must really exist.
        location ~ /[^/]+\.[^/]+$ {
            try_files $uri =404;
            add_header Cache-Control "no-cache, no-transform" always;
        }

        # Only extensionless application paths get the SPA entry point.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-transform" always;
        }
    }
}
